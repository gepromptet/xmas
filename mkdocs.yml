site_name: xmas
site_description: A lightweight framework for building and optimizing multi-agent systems.
repo_url: https://github.com/gepromptet/xmas
repo_name: gepromptet/xmas
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            docstring_style: google
            # A module's __all__ says what is public; nothing is hidden by a leading underscore.
            filters: public

nav:
  - Home: index.md
  - Guide:
      - Steps and values: guide/steps-and-values.md
      - Answers with a shape: guide/answer-forms.md
      - Conditions and loops: guide/conditions-and-loops.md
      - Reading a run: guide/reading-a-run.md
      - Drawing a system: guide/drawing-a-system.md
      - A system inside a system: guide/boxes.md
      - Once per item: guide/chains.md
      - Several values in and out: guide/run-state.md
      - Pictures and files: guide/media.md
      - People, Stop and races: guide/people.md
      - Bundles: guide/bundles.md
      - Optimization: guide/optimization.md
      - Where this is going: guide/roadmap.md
  - Design principles: design-principles.md
  - API reference: api.md

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true

copyright: Apache-2.0 licensed. Built by gepromptet.
