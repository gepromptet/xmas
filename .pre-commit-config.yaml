# Run on every commit: `uv run pre-commit install --install-hooks -t pre-commit -t commit-msg`
# Run over everything on demand: `uv run pre-commit run --all-files`
fail_fast: false
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # Secret detection runs first: a leaked credential is the one mistake that
  # cannot be undone by a follow-up commit.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.29.0
    hooks:
      - id: gitleaks

  # These hooks cover Python only. Ruff's own file discovery also formats Python
  # code blocks inside markdown, but the pre-commit hook hands it .md paths as if
  # they were Python source and it fails to parse them. CI runs `ruff format
  # --check .`, which does discovery properly, so README snippets are still
  # checked -- just by CI rather than here.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # mypy runs in the project environment rather than an isolated pre-commit venv:
  # strict checking needs the real dependencies (promptolution, networkx, numpy),
  # and mirroring them into additional_dependencies would be a second, drifting
  # copy of the dependency list. This is also exactly what CI runs.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, project env)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.15
    hooks:
      # Keeps uv.lock honest with pyproject.toml.
      - id: uv-lock

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: debug-statements
      - id: detect-private-key

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
