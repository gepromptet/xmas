[project]
name = "xmas"
description = "A lightweight framework for building and optimizing multi-agent systems."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Tom Zehle" }]
requires-python = ">=3.12,<3.13"
dynamic = ["version"]
keywords = ["multi-agent-systems", "llm", "agents", "prompt-optimization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
# promptolution is a hard dependency, not a family resemblance: xmas subclasses its
# base classes, so single-agent xmas *is* promptolution and its optimizers plug in
# without ports. Compatible range: track 2.x, refuse the next major.
dependencies = [
  "promptolution>=2.3.0,<3.0.0",
  "networkx>=3.7",
  "httpx>=0.28",
  "langgraph>=1.2.16,<1.3",
  # Imported directly by xmas (store.py, runtime.py); both come with langgraph.
  "langgraph-checkpoint>=4.3,<5",
  "langchain-core>=1.0",
  "pyyaml>=6.0",
  # xmas.tools builds tool schemas with pydantic directly; pinned rather than
  # left transitive (via langgraph and openai).
  "pydantic>=2.7",
  # Imported directly by xmas (api_llm.py, tools, tasks); bounds follow promptolution's.
  "openai>=1.0.0",
  "numpy>=1.26.0,<3.0.0",
  "pandas>=2.2.2",
]

[project.scripts]
xmas = "xmas.cli:main"

[project.urls]
Repository = "https://github.com/gepromptet/xmas"
Documentation = "https://github.com/gepromptet/xmas/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The version is single-sourced from the package. Keep the `__version__` line in
# xmas/__init__.py; the build reads it from there.
[tool.hatch.version]
path = "xmas/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["xmas"]

# ---------------------------------------------------------------------------
# Optional extras: a minimal core, heavy backends opted into explicitly.
# ---------------------------------------------------------------------------
[project.optional-dependencies]
# xmas.tools.mcp.MCPTools: tools served over MCP (streamable HTTP). tools/mcp.py
# imports httpx2 directly, so it is declared rather than left transitive via mcp.
mcp = ["mcp>=2.2,<3", "httpx2>=2.10.0"]

# Tooling. A PEP 735 group, so a plain `uv sync` installs it.
[dependency-groups]
dev = [
  "mcp>=2.2,<3",
  "httpx2>=2.10.0",
  "pre-commit>=4.0",
  "ruff>=0.16.9",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=1.0.6",
  "types-networkx>=3.6.1.20260911",
  "pandas-stubs>=3.0.5.260914",
  "types-pyyaml>=6.0.12.20260906",
  "vulture>=2.16",
  "deptry>=0.25.1",
]

# ---------------------------------------------------------------------------
# Ruff: linter + formatter. Replaces black, flake8, isort and pydocstyle.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["xmas", "tests"]

[tool.ruff.lint]
select = [
  "F",   # pyflakes
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "I",   # isort
  "N",   # pep8-naming
  "D",   # pydocstyle
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "ARG", # flake8-unused-arguments
  "PTH", # flake8-use-pathlib
  "TID", # flake8-tidy-imports
  "RUF", # ruff-specific
  "C90", # mccabe: cyclomatic complexity per function
  "PL",  # pylint: size limits (args, branches, returns, statements) and common mistakes
  "RET", # flake8-return: no assign-then-return, no else after return
  "PIE", # flake8-pie: unnecessary pass, spread, placeholders
  "PERF", # perflint: loops that should be comprehensions or extend
  "FURB", # refurb: modern idioms for old patterns
  "ERA", # eradicate: commented-out code
  "T20", # no print in the library; the CLI is the one place that prints
  "PT",  # flake8-pytest-style
  "A",   # flake8-builtins: no shadowed builtins
  "BLE", # blind except: a swallowed Exception has hidden real bugs here before
  "ISC", # implicit string concatenation
  "FLY", # static join to f-string
  "G",   # logging calls format lazily
  "LOG", # logging misuse
  "DTZ", # naive datetimes
  "INP", # implicit namespace packages
  "TC",  # imports used only for typing go under TYPE_CHECKING
  "FBT", # boolean positional arguments; public ones that would break callers carry a noqa
  # tryceratops, the readable part only: TRY003 (a class per message, 376 hits) is noise and
  # TRY004 is wrong for spec checks, which report malformed data as ValueError on purpose.
  "TRY002", "TRY201", "TRY203", "TRY300", "TRY400", "TRY401",
]
ignore = [
  "D203", # incompatible with D211 (blank line before class docstring)
  "D213", # incompatible with D212 (multi-line summary position)
]

# Ruff's defaults, written down so a change is a visible decision.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 5
max-branches = 12
max-returns = 6
max-statements = 50
max-nested-blocks = 5 # PLR1702 is preview-only today; the limit is set for when it lands

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["xmas"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names, so docstrings are optional; and a
# test double has to match the signature it is standing in for, whether or not it
# uses every argument.
"tests/**/*.py" = [
  "D100", "D103", "D104", "ARG001", "ARG002", "ARG005",
  # A test asserts literal expected values; naming each one would hide what is checked.
  "PLR2004",
  # Tests import an extra, or re-import a module, inside the one test that needs it.
  "PLC0415",
  # Tools defined in tests have their hints read at runtime (typing.get_type_hints).
  "TC001", "TC002", "TC003",
  # pytest passes parametrized booleans by name, and doubles mirror the call they stand in for.
  "FBT001", "FBT002", "FBT003",
]
# These two mirror documentation code blocks line for line, prints and output comments included.
"tests/test_docs_guide.py" = ["T201", "ERA001"]
"tests/test_readme_v2.py" = ["T201", "ERA001"]
# The command line talks to its user through stdout.
"xmas/cli.py" = ["T201"]
# xmas.trace is public API and always imported qualified, so it never hides the stdlib trace.
"xmas/trace.py" = ["A005"]
# The typed errors are named for what happened (BudgetExceeded, Stopped), without an Error suffix.
"xmas/errors.py" = ["N818"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy: strict. New code starts clean, so it stays clean.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["xmas", "tests"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
pretty = true

# promptolution ships no py.typed marker, so mypy would treat every base class we
# subclass as Any and strict mode would reject the subclassing outright. Following
# its source gives us the real signatures instead of silencing the check.
[[tool.mypy.overrides]]
module = ["promptolution.*"]
follow_untyped_imports = true

# `datasets` is imported lazily by GSM8KTask.from_huggingface and is deliberately
# not a dependency; see the docstring there.
[[tool.mypy.overrides]]
module = ["datasets.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true

[tool.coverage.run]
source = ["xmas"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# ---------------------------------------------------------------------------
# vulture: dead code. `uv run vulture xmas tests --min-confidence 80`
# ---------------------------------------------------------------------------
[tool.vulture]
# Parameters a signature must have but the body does not read:
ignore_names = [
  "attrs",        # HTMLParser.handle_starttag override (convert.py)
  "block_idx",    # promptolution evaluator override (optimization/broker.py)
  "new_versions", # langgraph BaseCheckpointSaver.put override (store.py)
  "maybe",        # test tool whose signature is what the test inspects (test_media.py)
]

# ---------------------------------------------------------------------------
# deptry: unused, missing and transitive dependencies. `uv run deptry .`
# ---------------------------------------------------------------------------
[tool.deptry.per_rule_ignores]
# datasets is imported lazily by GSM8KTask.from_huggingface and deliberately not a dependency.
DEP001 = ["datasets"]
